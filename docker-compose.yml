# intelliverify/docker-compose.yml

version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────
  db:
    image: postgres:15-alpine        # lightweight postgres image
    container_name: intelliverify_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: intelliverify
    ports:
      - "5433:5432"                  # expose to your machine so you can use pgAdmin
    volumes:
      - postgres_data:/var/lib/postgresql/data   # data persists even if container restarts.this is like a USB port.
                                                 # data is inside the port not in the container. so if container restarts, data is still there.       

  # ── Redis ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: intelliverify_redis
    restart: always
    ports:
      - "6379:6379"

  # ── FastAPI Backend ──────────────────────────
  backend:
    build:
      context: ./backend             # build using backend/Dockerfile
    container_name: intelliverify_backend
    restart: always
    ports:
      - "8000:8000"                  # http://localhost:8000
    env_file:
      - ./backend/.env               # loads your .env file into the container
    depends_on:
      - db                           # waits for postgres to start first
      - redis                        # waits for redis to start first
    volumes:
      - ./backend:/app               # maps your local backend folder into container
                                     # so --reload picks up your code changes live

                  # named volume — data survives container restarts



  # ── Celery Worker ────────────────────────────
  worker:
    build:
      context: ./backend             # same Dockerfile as backend — same image, different command
    container_name: intelliverify_worker
    restart: always
    command: celery -A worker.celery_app worker --loglevel=info
    # NOTE: no --pool=solo here. That was a Windows-only workaround.
    # Inside Linux Docker containers, the default pool works correctly.
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - paddle_models:/root/.paddleocr   # PaddleOCR downloads ~500MB of models on first run.
                                         # This volume caches them so restarts don't re-download.

  # ── React Frontend ───────────────────────────
  frontend:
    build:
      context: ./frontend            # build using frontend/Dockerfile
    container_name: intelliverify_frontend
    restart: always
    ports:
      - "3000:80"                    # visit localhost:3000 in your browser
    depends_on:
      - backend



volumes:
  postgres_data:  
  paddle_models: 