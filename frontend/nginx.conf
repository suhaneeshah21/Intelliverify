# frontend/nginx.conf

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Without this, refreshing any React Router route (e.g. /admin/applications)
    # returns a 404 from Nginx because that path doesn't exist as a real file.
    # This tells Nginx: if the file doesn't exist, serve index.html instead.
    # React Router then takes over and renders the correct page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}